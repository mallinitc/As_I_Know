ui_version: streamlit-interface-v1
page:
  title: Chest X-Ray Analysis and Explanation Assistant
  subtitle: API-driven educational decision-support prototype
  icon: 🩻
  layout: wide
  initial_sidebar_state: expanded
api:
  base_url_environment_variable: CHEST_XRAY_API_BASE_URL
  default_base_url: http://127.0.0.1:8000
safety:
  educational_limitation: This output is generated by an educational decision-support
    prototype. It is not a diagnosis and should not replace review by a qualified
    healthcare professional.
  gradcam_limitation: Grad-CAM shows image regions that influenced a model output.
    It must not be interpreted as lesion segmentation, causal proof, anatomical confirmation,
    or clinical diagnosis.
  professional_review_guidance: Review all outputs with a qualified healthcare professional.
upload:
  maximum_size_mib: 10
  maximum_size_bytes: 10485760
  supported_media_types:
  - image/png
  - image/jpeg
  supported_extensions:
  - png
  - jpg
  - jpeg
  image_mode_handling: convert accepted images to RGB
