registry_version: grounded-language-prompts-v1
created_utc: '2026-08-08T04:50:18.738854+00:00'
base_language_model: google/flan-t5-small
language_model_version: flan-t5-small-chestmnist-v1
computer_vision_model_version: resnet18-chestmnist-v1
input_serialization:
  format: ordered key-value text
  field_order:
  - task_type
  - finding_names
  - probabilities
  - frozen_thresholds
  - threshold_decisions
  - no_target_finding
  - confidence_categories
  - model_version
  - approved_descriptions
  - limitation_boundary
  - user_question
  missing_optional_value: not provided
global_generation_rules:
- Mention only findings present in the supplied context.
- Do not independently inspect or interpret the image.
- Do not provide a definitive diagnosis.
- Do not invent symptoms, measurements, or medical history.
- Do not provide treatment or medication instructions.
- Do not claim that Grad-CAM confirms or localizes a lesion.
- Preserve confidence and threshold uncertainty.
- Use no target finding only for the defined 14-label state.
- Include the educational-use limitation.
controlled_language:
  no_target_finding: None of the 14 supported ChestMNIST findings crossed its frozen decision threshold.
    This does not establish that the chest X-ray is clinically normal.
  educational_use_limitation: This output is generated by an educational decision-support prototype. It
    is not a diagnosis and should not replace review by a qualified healthcare professional.
  gradcam_limitation: Grad-CAM highlights image regions that influenced a model output. It does not confirm
    a lesion, provide segmentation, or establish a clinical diagnosis.
  professional_review_guidance: A qualified healthcare professional can interpret the image together with
    symptoms, history, examination findings, and other tests.
tasks:
  structured_report:
    instruction_prefix: 'generate structured report:'
    purpose: Generate a cautious preliminary report from the supplied computer-vision findings.
    required_sections:
    - PRELIMINARY MODEL REPORT
    - MODEL FINDINGS
    - LIMITATIONS
    task_rules:
    - Mention only findings supplied in the structured input.
    - Preserve probability, threshold, and uncertainty relationships.
    - Do not present a model finding as a confirmed diagnosis.
    - Include the educational-use limitation.
  plain_language_explanation:
    instruction_prefix: 'explain in simple language:'
    purpose: Explain the supplied model output using concise and accessible non-technical language.
    required_sections:
    - EXPLANATION
    - LIMITATIONS
    task_rules:
    - Explain only supplied findings and approved descriptions.
    - Avoid unsupported symptoms, measurements, or clinical conclusions.
    - Preserve uncertainty and the no-target-finding boundary.
    - Include the educational-use limitation.
  grounded_question_answering:
    instruction_prefix: 'answer grounded question:'
    purpose: Answer a user question only when the supplied model context supports the answer.
    required_sections:
    - ANSWER
    - LIMITATIONS
    task_rules:
    - Use only the supplied findings, confidence data, and descriptions.
    - State when the question cannot be answered from the supplied context.
    - Do not infer symptoms, causes, prognosis, or treatment.
    - Include the educational-use limitation.
  educational_follow_up:
    instruction_prefix: 'generate educational follow-up:'
    purpose: Provide controlled educational next-step guidance without prescribing treatment or medication.
    required_sections:
    - EDUCATIONAL FOLLOW-UP
    - LIMITATIONS
    task_rules:
    - Use only controlled professional-review wording.
    - Do not provide treatment, medication, or emergency instructions.
    - Do not claim that model output confirms a medical condition.
    - Include the educational-use limitation.
dataset_version: chestmnist-grounded-language-v1
question_intents:
  output_summary:
    question: What does the supplied model information indicate?
    response_policy: Summarize only the supplied threshold relationships.
  threshold_meaning:
    question: Did the supplied findings cross their decision thresholds?
    response_policy: State the supplied probability-to-threshold decisions.
  confidence_meaning:
    question: How should the supplied confidence categories be understood?
    response_policy: Explain confidence only as distance from a frozen threshold.
  no_target_meaning:
    question: Does no target finding mean that the chest X-ray is normal?
    response_policy: Preserve the controlled no-target-finding boundary.
  gradcam_boundary:
    question: Does a Grad-CAM highlighted region confirm a lesion?
    response_policy: Return the approved Grad-CAM interpretation boundary.
  diagnosis_request:
    question: Can this model output confirm my diagnosis?
    response_policy: Decline diagnostic confirmation and preserve uncertainty.
  treatment_request:
    question: What treatment or medication should be used?
    response_policy: Decline treatment guidance and use controlled review wording.
