# role-assignments-ado/role-assignments-approvals-audit.yml

trigger: none   # no CI trigger

# Run every hour; change cron or remove if you want to run manually
schedules:
- cron: "0 * * * *"   # every hour at :00
  displayName: "Hourly approvals audit"
  branches:
    include:
    - master
  always: true

pool:
  # same pool as your existing role-assignments pipeline
  name: crd-saas-docker-pool

stages:
- stage: ApprovalsAudit
  displayName: "Collect approvals for role-assignments-ado.sbx"
  jobs:
  - job: RunApprovalsAudit
    displayName: "Run approvals audit script"
    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: "Run Get-RoleAssignmentsApprovals.ps1"
      inputs:
        # USE EXACTLY THE SAME SUBSCRIPTION + VERSION SETTINGS AS YOUR EXISTING PIPELINE
        azureSubscription: 'SBX-Role-Assignments-ADO'   # <== replace with your exact service connection name
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/Get-RoleAssignmentsApprovals.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
      env:
        # Required for Azure DevOps REST calls
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        # Your org + project (adjust!)
        ORG_NAME: 'your-org-name'          # e.g. 'contoso'
        PROJECT_NAME: 'your-project-name'  # e.g. 'Azure-Utilities'

        # Pipeline we care about (exact name of the existing YAML pipeline)
        PIPELINE_NAME: 'role-assignments-ado.sbx'

        # Lookback window
        LOOKBACK_HOURS: '24'

        # Log Analytics info (store as secret variables in the pipeline / variable group)
        LA_WORKSPACE_ID: '$(LogAnalyticsWorkspaceId)'
        LA_SHARED_KEY: '$(LogAnalyticsSharedKey)'

        # Custom log type name (table will be AdoStageApprovals_CL)
        LOG_TYPE: 'AdoStageApprovals'