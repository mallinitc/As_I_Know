# pipeline-audit-role-assignment.yml
# collects last 24h runs of role-assignment-ado pipeline and pushes to Log Analytics

trigger: none   # run on schedule or manually

schedules:
  - cron: "0 * * * *"   # every hour (UTC) – adjust as you like
    displayName: "Hourly role-assignment-ado audit"
    branches:
      include:
        - main
    always: true

variables:
  # these can also come from variable group / library
  - name: Organization
    value: "your-org-name"
  - name: Project
    value: "your-project-name"
  - name: RoleAssignmentPipelineId
    value: "1234"                  # pipeline id of 'role-assignment-ado'
  - name: LogAnalyticsWorkspaceId
    value: "xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"   # WorkspaceId
  - name: LogAnalyticsLogType
    value: "AdoPipelineAudit"

  # Shared key should be a secret variable in UI / variable group
  # name: LogAnalyticsSharedKey   (marked secret)

pool:
  vmImage: ubuntu-latest

steps:
  # IMPORTANT: in pipeline UI > Additional options, enable:
  # "Allow scripts to access the OAuth token"
  - task: PowerShell@2
    displayName: "Collect last 24h runs of role-assignment-ado and push to Log Analytics"
    inputs:
      targetType: filePath
      filePath: "scripts/Collect-AdoRunsToLA.ps1"
      arguments: >
        -Organization "$(Organization)"
        -Project "$(Project)"
        -PipelineId $(RoleAssignmentPipelineId)
        -WorkspaceId "$(LogAnalyticsWorkspaceId)"
        -SharedKey "$(LogAnalyticsSharedKey)"
        -LogType "$(LogAnalyticsLogType)"
        -LookbackHours 24
      pwsh: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)