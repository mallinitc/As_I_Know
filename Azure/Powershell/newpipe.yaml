trigger: none

parameters:
  - name: Action
    displayName: "Select Action"
    type: string
    default: RoleManagement
    values:
      - RoleManagement   # Assign Azure RBAC role to SPN at scope
      - GroupAssign      # Assign Entra directory role to group
      - GroupCreate      # Create Entra ID group

  # ---- Common mandatory params ----
  - name: TenantId
    type: string
    default: ""
  - name: AppId
    type: string
    default: ""
  - name: Secret
    type: string
    default: ""

  # ---- RoleManagement params ----
  - name: TestL_scope
    type: string
    default: ""
  - name: RoleName
    type: string
    default: ""
  - name: SSPName
    type: string
    default: ""

  # ---- GroupAssign params ----
  - name: EntraRole
    type: string
    default: ""
  - name: GroupName
    type: string
    default: ""
  - name: MakePIMEligible
    type: boolean
    default: false

  # ---- GroupCreate params ----
  - name: GroupDescription
    type: string
    default: ""

variables:
- group: role-assignments-sbx   # tenantid, appid, secret stored securely

- name: AzureUtilitiesDir
  value: '$(Build.SourcesDirectory)/Azure Utilities'
- name: ScriptRoleManagement
  value: 'RoleManagement.ps1'
- name: ScriptGroupAssign
  value: 'Groupassign.ps1'
- name: ScriptGroupCreate
  value: 'GroupCreate.ps1'

pool:
  vmImage: windows-latest

steps:
- checkout: self

- task: AzurePowerShell@5
  displayName: "Run Selected Script"
  inputs:
    azureSubscription: 'sc-ado-role-automation'
    azurePowerShellVersion: 'LatestVersion'
    ScriptType: 'InlineScript'
    Inline: |
      $dir       = "$(AzureUtilitiesDir)"
      $roleMgmt  = Join-Path $dir "$(ScriptRoleManagement)"
      $groupAsgn = Join-Path $dir "$(ScriptGroupAssign)"
      $groupCrt  = Join-Path $dir "$(ScriptGroupCreate)"

      $action = "${{ parameters.Action }}"
      Write-Host ">>> Selected Action: $action"

      switch ($action) {

        'RoleManagement' {
          if (-not (Test-Path $roleMgmt)) { throw "RoleManagement.ps1 not found" }
          & $roleMgmt `
            -TenantId  "${{ parameters.TenantId }}" `
            -AppId     "${{ parameters.AppId }}" `
            -Secret    "${{ parameters.Secret }}" `
            -TestL_scope "${{ parameters.TestL_scope }}" `
            -RoleName  "${{ parameters.RoleName }}" `
            -SSPName   "${{ parameters.SSPName }}"
        }

        'GroupAssign' {
          if (-not (Test-Path $groupAsgn)) { throw "Groupassign.ps1 not found" }
          & $groupAsgn `
            -TenantId  "${{ parameters.TenantId }}" `
            -AppId     "${{ parameters.AppId }}" `
            -Secret    "${{ parameters.Secret }}" `
            -EntraRole "${{ parameters.EntraRole }}" `
            -GroupName "${{ parameters.GroupName }}" `
            -MakePIMEligible:(${ {parameters.MakePIMEligible} })
        }

        'GroupCreate' {
          if (-not (Test-Path $groupCrt)) { throw "GroupCreate.ps1 not found" }
          & $groupCrt `
            -TenantId  "${{ parameters.TenantId }}" `
            -AppId     "${{ parameters.AppId }}" `
            -Secret    "${{ parameters.Secret }}" `
            -GroupName "${{ parameters.GroupName }}" `
            -GroupDescription "${{ parameters.GroupDescription }}"
        }

        default { throw "Unknown Action: $action" }
      }
