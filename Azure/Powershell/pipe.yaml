# azure-pipelines.yml (minimal wrapper)
trigger: none

parameters:
  - name: Tier
    type: number
    default: 3

stages:
- stage: Validate
  jobs:
  - job: ValidateInputs
    steps:
    - pwsh: |
        Write-Host "Tier: $(Tier)"
        # Do input checks here if needed

# Gate stage only for Tier 1-2
- ${{ if or(eq(parameters.Tier, 1), eq(parameters.Tier, 2)) }}:
  - stage: Approval
    displayName: "Manual Approval (Tier 1-2)"
    dependsOn: Validate
    condition: succeeded()
    # Create an Environment named 'pim-approvals' with required approver group in ADO project settings
    environment: pim-approvals
    jobs:
    - job: Gate
      steps:
      - pwsh: Write-Host "Approved via environment gate."

- stage: Execute
  dependsOn: ${{ if or(eq(parameters.Tier, 1), eq(parameters.Tier, 2)) }}:
               [Approval]
             ${{ if and(ne(parameters.Tier, 1), ne(parameters.Tier, 2)) }}:
               [Validate]
  jobs:
  - job: DoWork
    steps:
    - checkout: self
    - pwsh: |
        # Call the PowerShell you saved as scripts/pim.ps1
        .\scripts\pim.ps1 `
          -Action 'AzureRbacAssign' `
          -TenantId '$(tenantId)' `
          -SubscriptionId '$(subscriptionId)' `
          -AzureRoleDefinitionIdOrName 'Owner' `
          -TargetObjectId '$(targetObjectId)' `
          -MakePIMEligible:$(makePIMEligible) `
          -Tier $(Tier) `
          -ApproverGroupObjectId '$(approverGroupObjectId)' `
          -SnowTicketNumber '$(snowTicketNumber)'




parameters:
- name: Action
  type: string
  default: RoleManagement
  values:
  - RoleManagement
  - GroupAssign
  - GroupCreate

stages:
- stage: RunActions
  displayName: Run Selected Action
  jobs:

  # -------- RoleManagement (requires approval) ----------
  - job: RoleManagementJob
    displayName: Role Management (with approval)
    condition: eq('${{ parameters.Action }}','RoleManagement')
    environment: role-mgmt-approval   # <-- the environment you created
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run RoleManagement.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/RoleManagement.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
        # env: (optional – your existing env block if needed)
      # (any variables or env you already had)

  # -------- GroupAssign (no approval) ----------
  - job: GroupAssignJob
    displayName: Group Assign
    condition: eq('${{ parameters.Action }}','GroupAssign')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run GroupAssign.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/GroupAssign.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true

  # -------- GroupCreate (no approval) ----------
  - job: GroupCreateJob
    displayName: Group Create
    condition: eq('${{ parameters.Action }}','GroupCreate')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run GroupCreate.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/GroupCreate.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true







# ---------------- Parameters ----------------
parameters:
- name: Action
  type: string
  default: RoleManagement
  values:
  - RoleManagement
  - GroupAssign
  - GroupCreate

- name: Test_scope
  type: string
  default: 'NA'

- name: RoleName
  type: string
  default: 'NA'

- name: SPName
  type: string
  default: 'NA'

- name: EntraRole
  type: string
  default: 'NA'

- name: GroupName
  type: string
  default: 'NA'

- name: MakePIMEligible
  type: string
  default: 'false'

- name: GroupDescription
  type: string
  default: 'NA'

- name: ChangeNumber
  type: string
  default: 'CHG0000000'

# ---------------- Variables ----------------
variables:
- name: AzureUtilitiesDir
  value: '$(System.DefaultWorkingDirectory)/role-assignments-ado'

- name: ScriptRoleManagement
  value: 'RoleManagement.ps1'

- name: ScriptGroupAssign
  value: 'GroupAssign.ps1'

- name: ScriptGroupCreate
  value: 'GroupCreate.ps1'

pool:
  name: crd-saas-docker-pool

# ======================================================
#   STAGES
# ======================================================
stages:
# ------------------------------------------------------
# 1. RoleManagement stage – has approval via environment
# ------------------------------------------------------
- stage: RoleManagementStage
  displayName: Role Management (requires approval)
  condition: eq('${{ parameters.Action }}','RoleManagement')
  jobs:
  - job: RoleManagementJob
    displayName: Run RoleManagement.ps1 (with approval)
    # environment must exist in ADO and have approvers configured
    environment: role-mgmt-approval
    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: Run RoleManagement.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        pwsh: true
        Inline: |
          $dir       = "$(AzureUtilitiesDir)"
          $roleMgmt  = Join-Path $dir "$(ScriptRoleManagement)"
          $groupAsgn = Join-Path $dir "$(ScriptGroupAssign)"
          $groupCrt  = Join-Path $dir "$(ScriptGroupCreate)"

          $action       = "${{ parameters.Action }}"
          $changenumber = "${{ parameters.ChangeNumber }}"

          Write-Host ">>> The Inputs ::"
          Write-Host ">>>Selected Action: $action"
          Write-Host ">>>Service Now Change: $changenumber"

          $TenantId = "$(TenantId)"
          $AppID    = "$(AppId)"
          $Secret   = "$(Secret)"

          $Testscope = "${{ parameters.Test_scope }}"
          $RoleName  = "${{ parameters.RoleName }}"
          $SPName    = "${{ parameters.SPName }}"

          $EntraRole       = "${{ parameters.EntraRole }}"
          $GroupName       = "${{ parameters.GroupName }}"
          $MakePIMEligible = [bool]::Parse("${{ parameters.MakePIMEligible }}")
          $Groupdesc       = "${{ parameters.GroupDescription }}"

          switch ($action) {
            'RoleManagement' {
              Write-Host ">>> File: $roleMgmt"
              if (-not (Test-Path $roleMgmt)) { throw "RoleManagement.ps1 not found" }
              & $roleMgmt `
                -TenantId     $TenantId `
                -AppId        $AppID `
                -Secret       $Secret `
                -Test_scope   $Testscope `
                -RoleName     $RoleName `
                -SPName       $SPName `
                -ChangeNumber $changenumber
            }
            default {
              throw "This stage should only run for RoleManagement (Action = $action)"
            }
          }
      env:
        instance:      $(instance)
        client_id:     $(client_id)
        client_secret: $(client_secret)
        username:      $(username)
        password:      $(password)
        appid:         $(appid)
        secret:        $(secret)
        tenantid:      $(tenantid)

# ------------------------------------------------------
# 2. Other actions – GroupAssign / GroupCreate (no approval)
# ------------------------------------------------------
- stage: OtherActionsStage
  displayName: GroupAssign / GroupCreate
  condition: ne('${{ parameters.Action }}','RoleManagement')
  jobs:
  - job: OtherActionsJob
    displayName: Run GroupAssign / GroupCreate
    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: Run GroupAssign / GroupCreate scripts
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        pwsh: true
        Inline: |
          $dir       = "$(AzureUtilitiesDir)"
          $roleMgmt  = Join-Path $dir "$(ScriptRoleManagement)"
          $groupAsgn = Join-Path $dir "$(ScriptGroupAssign)"
          $groupCrt  = Join-Path $dir "$(ScriptGroupCreate)"

          $action       = "${{ parameters.Action }}"
          $changenumber = "${{ parameters.ChangeNumber }}"

          Write-Host ">>> The Inputs ::"
          Write-Host ">>>Selected Action: $action"
          Write-Host ">>>Service Now Change: $changenumber"

          $TenantId = "$(TenantId)"
          $AppID    = "$(AppId)"
          $Secret   = "$(Secret)"

          $Testscope = "${{ parameters.Test_scope }}"
          $RoleName  = "${{ parameters.RoleName }}"
          $SPName    = "${{ parameters.SPName }}"

          $EntraRole       = "${{ parameters.EntraRole }}"
          $GroupName       = "${{ parameters.GroupName }}"
          $MakePIMEligible = [bool]::Parse("${{ parameters.MakePIMEligible }}")
          $Groupdesc       = "${{ parameters.GroupDescription }}"

          switch ($action) {
            'GroupAssign' {
              Write-Host ">>> File: $groupAsgn"
              if (-not (Test-Path $groupAsgn)) { throw "GroupAssign.ps1 not found" }
              & $groupAsgn `
                -TenantId        $TenantId `
                -AppId           $AppID `
                -Secret          $Secret `
                -EntraRole       $EntraRole `
                -GroupName       $GroupName `
                -MakePIMEligible $MakePIMEligible `
                -ChangeNumber    $changenumber
            }

            'GroupCreate' {
              Write-Host ">>> File: $groupCrt"
              if (-not (Test-Path $groupCrt)) { throw "GroupCreate.ps1 not found" }
              & $groupCrt `
                -TenantId         $TenantId `
                -AppId            $AppID `
                -Secret           $Secret `
                -GroupName        $GroupName `
                -GroupDescription $Groupdesc `
                -ChangeNumber     $changenumber
            }

            default {
              throw "Unknown Action in OtherActionsStage: $action"
            }
          }
      env:
        instance:      $(instance)
        client_id:     $(client_id)
        client_secret: $(client_secret)
        username:      $(username)
        password:      $(password)
        appid:         $(appid)
        secret:        $(secret)
        tenantid:      $(tenantid)