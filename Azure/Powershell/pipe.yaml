# azure-pipelines.yml (minimal wrapper)
trigger: none

parameters:
  - name: Tier
    type: number
    default: 3

stages:
- stage: Validate
  jobs:
  - job: ValidateInputs
    steps:
    - pwsh: |
        Write-Host "Tier: $(Tier)"
        # Do input checks here if needed

# Gate stage only for Tier 1-2
- ${{ if or(eq(parameters.Tier, 1), eq(parameters.Tier, 2)) }}:
  - stage: Approval
    displayName: "Manual Approval (Tier 1-2)"
    dependsOn: Validate
    condition: succeeded()
    # Create an Environment named 'pim-approvals' with required approver group in ADO project settings
    environment: pim-approvals
    jobs:
    - job: Gate
      steps:
      - pwsh: Write-Host "Approved via environment gate."

- stage: Execute
  dependsOn: ${{ if or(eq(parameters.Tier, 1), eq(parameters.Tier, 2)) }}:
               [Approval]
             ${{ if and(ne(parameters.Tier, 1), ne(parameters.Tier, 2)) }}:
               [Validate]
  jobs:
  - job: DoWork
    steps:
    - checkout: self
    - pwsh: |
        # Call the PowerShell you saved as scripts/pim.ps1
        .\scripts\pim.ps1 `
          -Action 'AzureRbacAssign' `
          -TenantId '$(tenantId)' `
          -SubscriptionId '$(subscriptionId)' `
          -AzureRoleDefinitionIdOrName 'Owner' `
          -TargetObjectId '$(targetObjectId)' `
          -MakePIMEligible:$(makePIMEligible) `
          -Tier $(Tier) `
          -ApproverGroupObjectId '$(approverGroupObjectId)' `
          -SnowTicketNumber '$(snowTicketNumber)'




parameters:
- name: Action
  type: string
  default: RoleManagement
  values:
  - RoleManagement
  - GroupAssign
  - GroupCreate

stages:
- stage: RunActions
  displayName: Run Selected Action
  jobs:

  # -------- RoleManagement (requires approval) ----------
  - job: RoleManagementJob
    displayName: Role Management (with approval)
    condition: eq('${{ parameters.Action }}','RoleManagement')
    environment: role-mgmt-approval   # <-- the environment you created
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run RoleManagement.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/RoleManagement.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
        # env: (optional – your existing env block if needed)
      # (any variables or env you already had)

  # -------- GroupAssign (no approval) ----------
  - job: GroupAssignJob
    displayName: Group Assign
    condition: eq('${{ parameters.Action }}','GroupAssign')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run GroupAssign.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/GroupAssign.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true

  # -------- GroupCreate (no approval) ----------
  - job: GroupCreateJob
    displayName: Group Create
    condition: eq('${{ parameters.Action }}','GroupCreate')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: AzurePowerShell@5
      displayName: Run GroupCreate.ps1
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: 'FilePath'
        ScriptPath: 'role-assignments-ado/GroupCreate.ps1'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
