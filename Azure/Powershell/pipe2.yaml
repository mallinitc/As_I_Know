trigger: none

parameters:
  - name: ScriptFile
    displayName: "Which script in Azure Utilities to run?"
    type: string
    default: "RBAC_Assignments_App.ps1"

variables:
- group: role-assignments-sbx   # your Library with tenantid, appid, secret

pool:
  vmImage: 'windows-latest'

steps:
# Checkout GitHub repo
- checkout: self

# Run chosen script from Azure Utilities folder
- task: AzurePowerShell@5
  displayName: "Run PowerShell script from GitHub repo"
  inputs:
    azurePowerShellVersion: 'LatestVersion'
    ScriptType: 'FilePath'
    # Build.SourcesDirectory points to repo root
    ScriptPath: '$(Build.SourcesDirectory)/Azure Utilities/${{ parameters.ScriptFile }}'
    ScriptArguments: >
      -TenantId "$(tenantid)"
      -AppId "$(appid)"
      -Secret "$(secret)"











# ========== PARAMETERS (same as before) ==========
parameters:
- name: Action
  type: string
  default: RoleManagement
  values:
  - RoleManagement
  - GroupAssign
  - GroupCreate

- name: Test_scope
  type: string
  default: 'NA'

- name: RoleName
  type: string
  default: 'NA'

- name: SPName
  type: string
  default: 'NA'

- name: EntraRole
  type: string
  default: 'NA'

- name: GroupName
  type: string
  default: 'NA'

- name: MakePIMEligible
  type: string
  default: 'false'

- name: GroupDescription
  type: string
  default: 'NA'

- name: ChangeNumber
  type: string
  default: 'CHG0000000'

# ========== VARIABLES (same as you had) ==========
variables:
- name: AzureUtilitiesDir
  value: '$(System.DefaultWorkingDirectory)/role-assignments-ado'

- name: ScriptRoleManagement
  value: 'RoleManagement.ps1'

- name: ScriptGroupAssign
  value: 'GroupAssign.ps1'

- name: ScriptGroupCreate
  value: 'GroupCreate.ps1'

pool:
  name: crd-saas-docker-pool

# IMPORTANT: from here on we use STAGES, no top-level "steps:"
stages:

# -------------------------------------------------
# 1. RoleManagement – protected by environment approval
# -------------------------------------------------
- stage: RoleManagementStage
  displayName: Role Management (with approval)
  condition: eq('${{ parameters.Action }}','RoleManagement')
  jobs:
  - deployment: RoleManagementJob          # deployment job so "environment" is valid
    displayName: Run RoleManagement.ps1
    environment: role-mgmt-approval        # <-- tie to environment (has approvals)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: Run RoleManagement.ps1
            inputs:
              azureSubscription: 'SBX-Role-Assignments-ADO-Test'
              ScriptType: InlineScript
              azurePowerShellVersion: LatestVersion
              pwsh: true
              Inline: |
                $dir       = "$(AzureUtilitiesDir)"
                $roleMgmt  = Join-Path $dir "$(ScriptRoleManagement)"
                $groupAsgn = Join-Path $dir "$(ScriptGroupAssign)"
                $groupCrt  = Join-Path $dir "$(ScriptGroupCreate)"

                $action       = "${{ parameters.Action }}"
                $changenumber = "${{ parameters.ChangeNumber }}"

                Write-Host ">>> The Inputs ::"
                Write-Host ">>>Selected Action: $action"
                Write-Host ">>>Service Now Change: $changenumber"

                $TenantId = "$(TenantId)"
                $AppID    = "$(AppId)"
                $Secret   = "$(Secret)"

                $Testscope = "${{ parameters.Test_scope }}"
                $RoleName  = "${{ parameters.RoleName }}"
                $SPName    = "${{ parameters.SPName }}"

                $EntraRole       = "${{ parameters.EntraRole }}"
                $GroupName       = "${{ parameters.GroupName }}"
                $MakePIMEligible = [bool]::Parse("${{ parameters.MakePIMEligible }}")
                $Groupdesc       = "${{ parameters.GroupDescription }}"

                switch ($action) {
                  'RoleManagement' {
                    Write-Host ">>> File: $roleMgmt"
                    if (-not (Test-Path $roleMgmt)) { throw "RoleManagement.ps1 not found" }
                    & $roleMgmt `
                      -TenantId     $TenantId `
                      -AppId        $AppID `
                      -Secret       $Secret `
                      -Test_scope   $Testscope `
                      -RoleName     $RoleName `
                      -SPName       $SPName `
                      -ChangeNumber $changenumber
                  }
                  default {
                    throw "This stage should only run for RoleManagement (Action = $action)"
                  }
                }
            env:
              instance:      $(instance)
              client_id:     $(client_id)
              client_secret: $(client_secret)
              username:      $(username)
              password:      $(password)
              appid:         $(appid)
              secret:        $(secret)
              tenantid:      $(tenantid)

# -------------------------------------------------
# 2. OtherActions – GroupAssign / GroupCreate, no approval
# -------------------------------------------------
- stage: OtherActionsStage
  displayName: GroupAssign / GroupCreate
  condition: ne('${{ parameters.Action }}','RoleManagement')
  jobs:
  - job: OtherActionsJob
    displayName: Run GroupAssign or GroupCreate
    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: Run GroupAssign / GroupCreate scripts
      inputs:
        azureSubscription: 'SBX-Role-Assignments-ADO-Test'
        ScriptType: InlineScript
        azurePowerShellVersion: LatestVersion
        pwsh: true
        Inline: |
          $dir       = "$(AzureUtilitiesDir)"
          $roleMgmt  = Join-Path $dir "$(ScriptRoleManagement)"
          $groupAsgn = Join-Path $dir "$(ScriptGroupAssign)"
          $groupCrt  = Join-Path $dir "$(ScriptGroupCreate)"

          $action       = "${{ parameters.Action }}"
          $changenumber = "${{ parameters.ChangeNumber }}"

          Write-Host ">>> The Inputs ::"
          Write-Host ">>>Selected Action: $action"
          Write-Host ">>>Service Now Change: $changenumber"

          $TenantId = "$(TenantId)"
          $AppID    = "$(AppId)"
          $Secret   = "$(Secret)"

          $Testscope = "${{ parameters.Test_scope }}"
          $RoleName  = "${{ parameters.RoleName }}"
          $SPName    = "${{ parameters.SPName }}"

          $EntraRole       = "${{ parameters.EntraRole }}"
          $GroupName       = "${{ parameters.GroupName }}"
          $MakePIMEligible = [bool]::Parse("${{ parameters.MakePIMEligible }}")
          $Groupdesc       = "${{ parameters.GroupDescription }}"

          switch ($action) {
            'GroupAssign' {
              Write-Host ">>> File: $groupAsgn"
              if (-not (Test-Path $groupAsgn)) { throw "GroupAssign.ps1 not found" }
              & $groupAsgn `
                -TenantId        $TenantId `
                -AppId           $AppID `
                -Secret          $Secret `
                -EntraRole       $EntraRole `
                -GroupName       $GroupName `
                -MakePIMEligible $MakePIMEligible `
                -ChangeNumber    $changenumber
            }

            'GroupCreate' {
              Write-Host ">>> File: $groupCrt"
              if (-not (Test-Path $groupCrt)) { throw "GroupCreate.ps1 not found" }
              & $groupCrt `
                -TenantId         $TenantId `
                -AppId            $AppID `
                -Secret           $Secret `
                -GroupName        $GroupName `
                -GroupDescription $Groupdesc `
                -ChangeNumber     $changenumber
            }

            default {
              throw "Unknown Action in OtherActionsStage: $action"
            }
          }
      env:
        instance:      $(instance)
        client_id:     $(client_id)
        client_secret: $(client_secret)
        username:      $(username)
        password:      $(password)
        appid:         $(appid)
        secret:        $(secret)
        tenantid:      $(tenantid)