trigger: none

schedules:
- cron: "0 3,15 * * *"
  branches:
    include: [ main ]
  always: true

pool:
  vmImage: ubuntu-latest

steps:
- task: PowerShell@2
  displayName: "Collect approvals for SBX role assignments"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: inline
    script: |
      # (paste the PowerShell script here)
- task: PublishBuildArtifacts@1
  displayName: "Publish approvals report"
  inputs:
    pathToPublish: approvals-report
    artifactName: approvals-report
    publishLocation: Container